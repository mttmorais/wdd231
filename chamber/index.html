<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber of Commerce Home Page</title>

    <meta name="description" content="This page is about the Chamber Directory project from BYU Web Design">
    <meta name="author" content="Matheus Morais">

    <!-- Facebook Open Graph Meta Tags -->
    <meta property="og:title" content="WDD 231 | Chamber Home Page | Matheus Morais">
    <meta property="og:description" content="This page is about the Chamber Directory project from BYU Web Design">
    <meta property="og:image" content="https://mttmorais.github.io/wdd231/chamber/images/chamber-homepage.webp" />
    <meta property="og:url" content="https://mttmorais.github.io/wdd231/chamber/index.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="icon" href="favicon.ico">
    <script type="module" src="scripts/home.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="site-header">
        <header>
            <img src="images/homepage-logo.svg" alt="Chamber Home Page logo" width="48" height="48">
            <span>Matheus Morais</span>
            <button id="ham-button" class="ham-menu" aria-label="Open navigation menu"></button>
        </header>

        <nav class="navigation">
            <ul>
                <li><a class="current" href="index.html" title="Home">Home</a></li>
                <li><a href="directory.html" title="Directory">Directory</a></li>
                <li><a href="#" title="Join">Join</a></li>
                <li><a href="#" title="Discover">Discover</a></li>
            </ul>
        </nav>
    </div>

    <main class="homepage">
        <section class="hero">
            <img src="images/celebration-hero.webp" alt="View of Celebration, Florida" width="1200" height="500"
                fetchpriority="high">

            <div class="hero-content">
                <h1>Welcome to Celebration</h1>
                <p>Building a stronger business community together.</p>
                <a href="directory.html" class="cta-button">Join the Chamber</a>
            </div>
        </section>

        <section id="events">
            <h2>Current Events</h2>
        </section>

        <section class="weather">
            <h2>Weather</h2>
            <span id="weather-current"></span>

            <h3>Forecast</h3>
            <div id="weather-forecast"></div>
        </section>

        <section class="spotlights">
            <h2>Business Spotlights</h2>

            <div id="spotlights-cards"></div>
        </section>

    </main>

    <footer>
        <nav class="socialmedia" aria-label="Social Media Links">
            <a href="https://www.facebook.com" target="_blank"><img src="images/facebook-square.svg"
                    alt="Facebook link"></a>
            <a href="https://www.linkedin.com" target="_blank"><img src="images/linkedin-square.svg"
                    alt="LinkedIn link"></a>
            <a href="https://github.com/mttmorais" target="_blank"><img src="images/github-square.svg"
                    alt="GitHub profile"></a>
        </nav>
        <div class="footer-info">
            <p class="back">©<span id="currentyear"></span> | Matheus Morais | Brazil</p>
            <p id="lastModified" class="back"></p>
        </div>
    </footer>

</body>

</html>
