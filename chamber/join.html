<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration Local Business Join Page</title>

    <meta name="description" content="Join in our group to know more about the local business and companies.">
    <meta name="author" content="Matheus Morais">

    <!-- Facebook Open Graph Meta Tags -->
    <meta property="og:title" content=">Celebration Local Business Join Page">
    <meta property="og:description" content="Join in our group to know more about the local business and companies.">
    <meta property="og:image" content="https://mttmorais.github.io/wdd231/chamber/images/join-page.webp">
    <meta property="og:url" content="https://mttmorais.github.io/wdd231/chamber/index.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="icon" href="favicon.ico">
    <script type="module" src="scripts/join.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="site-header">
        <header>
            <img src="images/joinpage-logo.svg" alt="Chamber Home Page logo" width="48" height="48">
            <span>Celebration Local Business</span>
            <button id="ham-button" class="ham-menu" aria-label="Open navigation menu"></button>
        </header>

        <nav class="navigation">
            <ul>
                <li><a href="index.html" title="Home">Home</a></li>
                <li><a href="directory.html" title="Directory">Directory</a></li>
                <li><a class="current" href="join.html" title="Join">Join</a></li>
                <li><a href="discover.html" title="Discover">Discover</a></li>
            </ul>
        </nav>
    </div>

    <main class="joinPage">
        <h1>Join</h1>

        <section id="applicationForm">
            <h2>Membership Application Form</h2>
            <form method="get" action="thankyou.html">

                <label>First Name
                <input type="text" name="firstName" required autocomplete="given-name" title="Yor First Name" placeholder="Matthew"></label>

                <label>Last Name
                <input type="text" name="lastName" required autocomplete="family-name" title="Your Last Name" placeholder="Stuart"></label>

                <label>Title
                <input type="text"  name="title" autocomplete="organization-title" title="Your Organizational Title" pattern="[A-Za-z -]{7,}"></label>

                <label>Email Address
                <input type="email" name="email" required autocomplete="email" title="Your Email" placeholder="your-email-here@example.com"></label>

                <label>Phone Number
                <input type="tel" name="phoneNumber" required autocomplete="tel" title="Your Phone Number"></label>

                <label>Organization
                <input type="text" name="businessName" required autocomplete="organization" title="Your Business Name"></label>

                <label>Describe your business
                <textarea name="description" title="Describe Your Business" placeholder="Tell us about your business..."></textarea></label>
                
                <input type="hidden" id="timestamp"  name="timestamp">

                <fieldset>
                    <legend>Membership Level</legend>

                    <label>
                        <input type="radio" name="level" value="np" checked>Non Profit Membership</label>

                    <label>
                        <input type="radio" name="level" value="bronze">Bronze Membership</label>

                    <label>
                        <input type="radio" name="level" value="silver">Silver Membership</label>

                    <label>
                        <input type="radio" name="level" value="gold">Gold Membership</label>
                </fieldset>

                <button class="form-button" type="submit">Apply for Membership</button>
            </form>
        </section>

        <section id="membershipInfo">
            <h2>Membership Levels</h2>
        </section>
        
        <dialog id="membershipDetails">
            <div>
                <h2></h2>
                <button id="closeButton">X</button>
            </div>
            <h3></h3>
            <ul></ul>
            <p></p>
        </dialog>



    </main>

    <footer>
        <nav class="socialmedia" aria-label="Social Media Links">
            <a href="https://www.facebook.com" target="_blank"><img src="images/facebook-square.svg"
                    alt="Facebook"></a>
            <a href="https://www.linkedin.com" target="_blank"><img src="images/linkedin-square.svg"
                    alt="LinkedIn"></a>
            <a href="https://github.com/mttmorais" target="_blank"><img src="images/github-square.svg"
                    alt="GitHub"></a>
        </nav>
        <div class="footer-info">
            <p class="back">©<span id="currentyear"></span> | Matheus Morais | Brazil</p>
            <p id="lastModified" class="back"></p>
        </div>
    </footer>
</body>

</html>
